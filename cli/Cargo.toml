[package]
name = "xlib"
version = "0.1.0"
edition = "2021"
description = "Tulis modul sekali di Rust, pakai di Python, Kotlin, Swift, Go, dan lainnya."

[[bin]]
name = "xlib"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
indicatif = "0.18"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
